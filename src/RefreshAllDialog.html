<!DOCTYPE html>
<html>

<head>
  <title>Refresh all</title>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      font-size: 13px;
      color: #3c4043;
      background: #fff;
      line-height: 1.4;
    }

    .container {
      padding: 16px;
    }

    h2 {
      font-size: 16px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 12px;
    }

    .steps {
      list-style: none;
    }

    .steps li {
      padding: 4px 0 4px 22px;
      position: relative;
      color: #80868b;
    }

    .steps li::before {
      content: '\25CB';
      position: absolute;
      left: 0;
    }

    .steps li.active {
      color: #202124;
    }

    .steps li.done {
      color: #137333;
    }

    .steps li.done::before {
      content: '\2713';
    }

    .steps li.failed {
      color: #c5221f;
    }

    .steps li.failed::before {
      content: '\2715';
    }

    .status-message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }

    .status-success {
      background: #e6f4ea;
      color: #137333;
    }

    .status-error {
      background: #fce8e6;
      color: #c5221f;
    }

    .btn {
      display: none;
      width: 100%;
      height: 36px;
      margin-top: 12px;
      border-radius: 4px;
      border: 1px solid #dadce0;
      background: #fff;
      color: #1a73e8;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Refresh all</h2>
    <ul class="steps">
      <li id="step-1">Renumber captions and update cross-references</li>
      <li id="step-2">Update lists of tables and figures</li>
    </ul>
    <div id="status-message" class="status-message"></div>
    <button type="button" class="btn" id="close-btn">Close</button>
  </div>

  <script>
    var statusEl = document.getElementById('status-message');
    var closeBtn = document.getElementById('close-btn');
    var step1 = document.getElementById('step-1');
    var step2 = document.getElementById('step-2');

    function setStep(el, state) {
      el.className = state;
    }

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status-message status-' + type;
      statusEl.style.display = 'block';
    }

    function fail(stepEl, message) {
      setStep(stepEl, 'failed');
      showStatus(message, 'error');
      closeBtn.style.display = 'block';
    }

    function onFailure(stepEl) {
      return function(err) {
        fail(stepEl, 'Error: ' + err.message);
      };
    }

    function runStep2(step1Result) {
      setStep(step1, 'done');
      setStep(step2, 'active');

      // Lists are refreshed in their own call so the document is settled after step 1
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result.success) {
            fail(step2, result.message);
            return;
          }
          setStep(step2, 'done');
          showStatus(step1Result.message + ' ' + result.message, 'success');
          setTimeout(function() { google.script.host.close(); }, 2500);
        })
        .withFailureHandler(onFailure(step2))
        .refreshAllLists();
    }

    setStep(step1, 'active');
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result.success) {
          fail(step1, result.message);
          return;
        }
        runStep2(result);
      })
      .withFailureHandler(onFailure(step1))
      .refreshAllCaptionsAndReferences();

    closeBtn.addEventListener('click', function() {
      google.script.host.close();
    });
  </script>
</body>

</html>
