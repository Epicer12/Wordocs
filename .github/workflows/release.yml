name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Wordocs release

            Google Docs add-on for professional captions, lists, and cross-references.

            ### Features
            - Numbered **table and figure captions** (table captions above or below the table)
            - **List of Tables** and **List of Figures**, updated from the sidebar
            - Clickable **cross-references** (label, number only, or full caption text)
            - **Wordocs > Refresh All**: renumber, update references and rebuild lists
            - **Settings**: custom Table/Figure labels and caption position
            - Automatic caption numbering on open and before each insert

            ### Installation
            See the [Installation Guide](https://github.com/Epicer12/Wordocs/blob/main/docs/INSTALLATION.md).

            ### Development
            ```bash
            npm install
            npx clasp login
            npm run push
            ```
